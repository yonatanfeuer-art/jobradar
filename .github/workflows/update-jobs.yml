name: Update jobs
on:
  workflow_dispatch:
  schedule:
    - cron: '15 4 * * *'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch jobs
        run: python scripts/fetch_jobs.py
      - name: Commit data
        run: |
          git config user.name "jobradar-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/jobs.json
          git diff --cached --quiet || git commit -m "Update jobs"
          git push
