name: Update real jobs

on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: write

concurrency:
  group: jobradar-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Save previous snapshot
        run: cp data/jobs.json data/jobs.previous.json 2>/dev/null || true

      - name: Fetch and score real jobs
        run: python scripts/fetch_jobs.py

      - name: Validate output
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('data/jobs.json').read_text(encoding='utf-8'))
          assert isinstance(data.get('jobs'), list)
          assert data.get('generated_at')
          assert data.get('summary', {}).get('window_days') == 7
          print(f"Validated {len(data['jobs'])} jobs from the last 7 days")
          PY

      - name: Email new-job alert
        env:
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_THRESHOLD: '3'
          ALERT_SCORE: '95'
          JOBRADAR_URL: https://yonatanfeuer-art.github.io/jobradar/
        run: python scripts/notify_new_jobs.py

      - name: Remove temporary snapshot
        run: rm -f data/jobs.previous.json

      - name: Commit updated data
        run: |
          git config user.name "jobradar-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/jobs.json
          git diff --cached --quiet || git commit -m "Hourly jobs refresh"
          git push
