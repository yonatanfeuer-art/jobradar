name: Update real jobs

on:
  workflow_dispatch:
  schedule:
    # Israel changes between UTC+2 and UTC+3. Run at both possible UTC hours
    # and let the timezone gate continue only when local time is 09:00.
    - cron: '0 6 * * *'
    - cron: '0 7 * * *'

permissions:
  contents: write

concurrency:
  group: jobradar-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check Israel local time
        id: clock
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import os
          from datetime import datetime
          from zoneinfo import ZoneInfo
          manual = os.environ.get('GITHUB_EVENT_NAME') == 'workflow_dispatch'
          israel = datetime.now(ZoneInfo('Asia/Jerusalem'))
          should_run = manual or israel.hour == 9
          print(f"run={'true' if should_run else 'false'}")
          print(f"israel_time={israel.isoformat()}")
          PY

      - name: Fetch and score real jobs
        if: steps.clock.outputs.run == 'true'
        run: python scripts/fetch_jobs.py

      - name: Validate output
        if: steps.clock.outputs.run == 'true'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('data/jobs.json').read_text(encoding='utf-8'))
          assert isinstance(data.get('jobs'), list)
          assert data.get('generated_at')
          assert data.get('summary', {}).get('window_days') == 7
          print(f"Validated {len(data['jobs'])} jobs from the last 7 days")
          PY

      - name: Commit updated data
        if: steps.clock.outputs.run == 'true'
        run: |
          git config user.name "jobradar-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/jobs.json
          git diff --cached --quiet || git commit -m "Daily 09:00 Israel jobs refresh"
          git push
