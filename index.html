<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>JobRadar — המשרות שמתאימות לי</title>
  <link rel="stylesheet" href="assets/style.css" />
</head>
<body>
  <header class="hero">
    <div class="brand-row">
      <div class="brand-mark">JR</div>
      <div><h1>JobRadar</h1><p>כל משרות המכירות הרלוונטיות מהשבוע האחרון — במקום אחד.</p></div>
    </div>
    <div class="header-actions"><button id="refreshBtn">רענון נתונים</button></div>
    <small id="dataStatus">טוען נתונים...</small>
  </header>

  <main>
    <section class="hero-panel">
      <div><span class="eyebrow">החיפוש האישי של יונתן</span><h2>פחות לחפש. יותר להגיע לראיונות.</h2><p>פתח משרה, בדוק התאמה וצור קשר ישירות עם החברה או מנהל הגיוס.</p></div>
      <div class="week-chip">7 ימים אחרונים</div>
    </section>

    <section id="newBanner" class="new-banner" hidden></section>
    <section class="stats" id="stats"></section>

    <section class="controls-shell">
      <div class="search-wrap"><span>⌕</span><input id="q" type="search" placeholder="חפש תפקיד, חברה, תחום או מיקום..." /></div>
      <div class="controls">
        <select id="company"><option value="">כל החברות</option></select>
        <select id="freshness"><option value="1">מהיום</option><option value="3">3 ימים</option><option value="7" selected>7 ימים</option><option value="all">הכול</option></select>
        <select id="score"><option value="0">כל ההתאמות</option><option value="70">70%+</option><option value="80">80%+</option><option value="90">90%+</option></select>
        <select id="statusFilter"><option value="all">כל הסטטוסים</option><option value="unread">לא נקראו</option><option value="saved">מועדפים</option><option value="planned">מתכנן לפנות</option><option value="contacted">יצרתי קשר</option><option value="interview">ראיון</option></select>
        <label><input id="onlyIsrael" type="checkbox" checked /> ישראל בלבד</label>
        <label><input id="onlyNew" type="checkbox" /> רק חדשות</label>
      </div>
    </section>

    <section class="toolbar"><strong id="resultCount"></strong><div><button id="markAllRead" class="secondary">סמן הכול כנקרא</button><button id="showHidden" class="secondary">הצג מוסתרות</button><button id="clearState" class="secondary">איפוס</button></div></section>
    <section id="jobs" class="jobs"></section>
    <section id="empty" class="empty" hidden><h2>אין תוצאות בפילטר הזה</h2><p>נסה להרחיב את החיפוש או להסיר פילטר.</p></section>
  </main>

  <template id="jobTemplate">
    <article class="job-card">
      <div class="job-main"><div class="company-logo"></div><div class="job-copy"><div class="badges"></div><h2 class="title"></h2><p class="meta"></p><p class="why"></p></div></div>
      <div class="score-box"><strong class="score"></strong><span>התאמה</span></div>
      <div class="actions"><a class="apply" target="_blank" rel="noopener">פתח את המשרה</a><button class="save secondary">☆ שמור</button><select class="tracker"><option value="none">ללא סטטוס</option><option value="planned">מתכנן לפנות</option><option value="contacted">יצרתי קשר</option><option value="interview">ראיון</option><option value="offer">הצעה</option><option value="rejected">נדחה</option></select><button class="dismiss secondary">לא רלוונטי</button></div>
    </article>
  </template>
  <script src="assets/app.js"></script>
</body>
</html>
